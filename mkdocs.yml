site_name: Soul Agent Platform
site_description: >-
  Product source of truth for the Soul Agent Platform: requirements,
  architecture, decisions, security and privacy, verification, release and
  operations, plus the frozen source papers.
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  admonition: {}
  tables: {}
  toc:
    permalink: true
  pymdownx.superfences:
    custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format

