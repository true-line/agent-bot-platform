# Original files are held privately by the owner, outside this repository:
# they carry personal names and document metadata, and this repository will
# be public. `original` names the file and `sha256` pins it, so the owner can
# prove a conversion came from a specific original (set PLATFORM_SOURCES_DIR
# and run tools/check_platform.py). The Markdown conversion under docs/papers/
# or docs/archive/ is the in-repo record; personal names in it are replaced by
# "True Line AI". `converted_sha256` pins that conversion, so a frozen paper
# cannot change without a registry change. Content moves out of a source into
# a controlled record and is cited back to the source ID.

