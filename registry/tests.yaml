  observation: Local traffic continues; queued work drains with deduplicated transitions.
  verifies:
  - R9
  implemented-in: soul-conformance
  implementation: not-started
  status: Specified
- id: T14
  title: Version mismatch
  stage: '0'
  stimulus: Use N-1 and an unknown required capability
  observation: Supported version works; unsupported semantics fail explicitly.
  verifies:
  - R7
  implemented-in: soul-conformance
  component-tests:
  - agent-bot-daemon tests/hq-admission.test.mjs (unsupported version on Hello)
  - agent-bot-daemon tests/sdk-wire.test.mjs (unknown required capability)
