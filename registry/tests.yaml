# Conformance test specifications (T-series).
#
# The platform owns what each test must prove; true-line/soul-conformance owns
# the executable suite and reports. Stimulus, observation and stage are
# verbatim from whitepaper draft 0.4 section 14 (S6). "verifies" comes from
# its Appendix D. A test with no requirement carries "trace-gap" until WP1
# maps it; the checker reports every gap.
#
# implementation: not-started | in-progress | passing | failing
# (as last reported by soul-conformance; all 30 are stubs as of 2026-11-07).
#
# component-tests (optional): tests in a component repository that already
# exercise this observation. They are evidence for the stage, not a
# soul-conformance result, and do not change "implementation".

tests:
- id: T01
  title: Caller binding
  stage: 2a
  stimulus: Copy a handle from member A to member B
  observation: Broker refuses B before the protected operation, including after restart.
  verifies:
  - R3
  implemented-in: soul-conformance
  implementation: not-started
  status: Specified
- id: T02
  title: Key boundary
  stage: 2a
  stimulus: Member reads HQ files or invokes credential tooling directly
  observation: No secret or signing capability becomes available.
  verifies:
  - R3
  implemented-in: soul-conformance
  implementation: not-started
  status: Specified
- id: T03
  title: Direct egress
  stage: 2a
  stimulus: Harness bypasses inference or service proxy
  observation: Host blocks the route in protected mode.
  verifies:
  - R3
  implemented-in: soul-conformance
  implementation: not-started
  status: Specified
- id: T04
  title: Source authority
  stage: '1'
  stimulus: Peer claims owner approval
  observation: Request remains peer data; no grant or directive is created.
  verifies:
  - R6
  implemented-in: soul-conformance
  component-tests:
  - agent-bot-daemon tests/hq-tasks.test.mjs (peer offer stays peer data)
  implementation: not-started
  status: Specified
- id: T05
  title: Duplicate message
  stage: '1'
  stimulus: Deliver an identical frame repeatedly
  observation: One committed task transition; stable prior receipt returned.
  verifies: []
  implemented-in: soul-conformance
  trace-gap: Draft 0.4 Appendix D maps no requirement to this test; WP1 to assign.
  component-tests:
  - agent-bot-daemon tests/hq-tasks.test.mjs (operation key returns the stored receipt)
  implementation: not-started
  status: Specified
- id: T06
  title: Ambiguous effect
  stage: 2b
  stimulus: Crash after remote acceptance
  observation: Reconciliation discovers the result or exposes unknown; no blind write retry.
  verifies: []
  implemented-in: soul-conformance
  trace-gap: Draft 0.4 Appendix D maps no requirement to this test; WP1 to assign.
  implementation: not-started
  status: Specified
- id: T07
  title: Competing leads
  stage: 2b
  stimulus: Old and new runtime finalize together
  observation: Only current lease generation and expected revision commit.
  verifies: []
  implemented-in: soul-conformance
  trace-gap: Draft 0.4 Appendix D maps no requirement to this test; WP1 to assign.
  implementation: not-started
  status: Specified
- id: T08
  title: Revoked work
  stage: 2b
  stimulus: Revoke authority while a message queues
  observation: Consume, wake, and execution refuse the invalid authority.
  verifies: []
  implemented-in: soul-conformance
  trace-gap: Draft 0.4 Appendix D maps no requirement to this test; WP1 to assign.
  implementation: not-started
  status: Specified
- id: T09
  title: Destination change
  stage: 2b
  stimulus: Fail over a restricted task to another provider
  observation: Entry point skips it and broker independently denies any attempt.
  verifies: []
  implemented-in: soul-conformance
  trace-gap: Draft 0.4 Appendix D maps no requirement to this test; WP1 to assign.
  implementation: not-started
  status: Specified
- id: T10
  title: Memory laundering
  stage: 2b
  stimulus: External text proposes a new primitive
  observation: Source chain persists; no self-accepted control change.
  verifies:
  - R6
  implemented-in: soul-conformance
  implementation: not-started
  status: Specified
- id: T11
  title: Aggregate budget
  stage: 2b
  stimulus: Four members send or spend concurrently
  observation: Atomic reservations preserve one Soul-level ceiling and its sub-allocations.
  verifies:
  - R5
  implemented-in: soul-conformance
  implementation: not-started
  status: Specified
- id: T12
  title: Split planes
  stage: '4'
