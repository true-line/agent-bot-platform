  stage: 2a
  stimulus: Run the protected suite under the cooperative profile
  observation: Every receipt names cooperative; any protected claim is refused with profile_insufficient.
  verifies:
  - R8
  implemented-in: soul-conformance
  implementation: not-started
  status: Specified
- id: T22
